- id: church_own_sermon
  slots:
  - sermon
  title: Your church's own recorded sermon
  provider: user
  license: user_provided
  fetch:
    method: local
    hint: Record a real sermon (with the pastor's permission) as 48 kHz mono WAV and place it under recordings/stems/eval/church_own_sermon/.
      This is the only realistic preaching source.
  notes: 'Highest-value source: energetic delivery, pauses, whisper-level prayer, plosives.'
- id: volunteer_live
  slots:
  - sermon
