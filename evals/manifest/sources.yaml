  provider: user
  license: user_provided
  fetch:
    method: local
    hint: 'Record 8+ minutes through the real pulpit mic chain: announcements, a whispered prayer, handling noise, plosives.
      Place WAV/FLAC under recordings/stems/eval/volunteer_live/.'
