# Source ledger for the MainStage multitrack eval (docs/EVAL_SPEC.md).
# Audio is NEVER committed: recordings/ is gitignored. `run_eval.py fetch` downloads to recordings/stems/eval/<id>/.
# Cambridge-MT: the index lists genre and track counts only (no instruments), so every pick is by genre and must be
# auditioned (`run_eval.py audition`). Artist anchors are matched by name at fetch time; they have not been verified
# against the live page. Commercial use of these multitracks is unresolved: ask the site owner before shipping.
schema_version: 1
licenses:
  cambridge_mt:
    id: cambridge-mt-library
    commercial_use: unknown
    redistribute: false
    attribution: Courtesy of the Cambridge-MT Mixing Secrets Free Multitrack Download Library.
    terms_url: https://cambridge-mt.com/ms/mtk-faq
  public_domain_us:
    id: public-domain-us
    commercial_use: allowed
    redistribute: true
    attribution: LibriVox recording (public domain in the US).
    terms_url: https://librivox.org/pages/public-domain/
